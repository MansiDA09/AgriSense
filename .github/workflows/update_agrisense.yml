name: Update AgriSense

on:
  schedule:
    - cron: "30 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run AgriSense
        run: |
          python agrisense_live.py

      - name: Save updated data
        run: |
          git config user.name "AgriSense Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          git commit -m "Automatic AgriSense weather update" || echo "No changes to commit"

          git push
